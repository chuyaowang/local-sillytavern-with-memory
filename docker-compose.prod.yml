# Overlay for the "real use" stack -- run alongside docker-compose.yml, not
# standalone (it relies on the roleplay-net network and the ollama service
# declared there):
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d qdrant-prod mem0-prod sillytavern-prod
#
# The existing docker-compose.yml services (qdrant, mem0, sillytavern) keep
# running unchanged as the development/testing stack. Both stacks share the
# one ollama service -- GPU/VRAM is the scarce resource, and there's no
# reason to load the model twice -- but get entirely separate Qdrant storage,
# so memory data from testing never lands in the store you actually use.

volumes:
  qdrant_storage_prod:

services:
  qdrant-prod:
    image: qdrant/qdrant:latest
    container_name: qdrant-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:6343:6333" # REST
      - "127.0.0.1:6344:6334" # gRPC
    volumes:
      - qdrant_storage_prod:/qdrant/storage
    networks:
      - roleplay-net

  mem0-prod:
    build: ./mem0-service
    container_name: mem0-prod
    restart: unless-stopped
    environment:
      MEM0_TELEMETRY: "False"
      QDRANT_HOST: qdrant-prod
      MEM0_LLM_MODEL: gemma4-e4b-hauhaucs
    ports:
      - "127.0.0.1:8011:8001"
    depends_on:
      - ollama
      - qdrant-prod
    networks:
      - roleplay-net

  sillytavern-prod:
    image: ghcr.io/sillytavern/sillytavern:latest
    container_name: sillytavern-prod
    hostname: sillytavern-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - FORCE_COLOR=1
      - SILLYTAVERN_HEARTBEATINTERVAL=30
    ports:
      # Bound to all interfaces, same as the dev sillytavern container --
      # both are reachable over Tailscale, on different ports.
      - "8010:8000"
    volumes:
      - "./sillytavern-prod/config:/home/node/app/config"
      - "./sillytavern-prod/data:/home/node/app/data"
      # Plugin/extension code is shared with dev on purpose -- it's
      # git-tracked source, not runtime data, so there's nothing to
      # contaminate. Only config (auth/whitelist) and data (chats,
      # characters) are duplicated per stack.
      - "./sillytavern/plugins:/home/node/app/plugins"
      - "./sillytavern/extensions:/home/node/app/public/scripts/extensions/third-party"
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - roleplay-net