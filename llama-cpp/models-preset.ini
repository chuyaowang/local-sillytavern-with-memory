# Router-mode model presets for the llama-cpp service (docker-compose.yml).
# See docs/LLAMA_CPP_BENCHMARK.md ("Production shape: one router service,
# not two") for how this was arrived at and verified.
#
# One [section] per model; section name is what clients request via the
# "model" field (SillyTavern's llama.cpp connection dropdown, mem0's
# MEM0_LLM_MODEL / MEM0_EMBEDDER_PROVIDER config). Keys match llama-server
# CLI flags with the leading dashes dropped.
#
# --models-max 2 (set on the container command, not here): Q4 and Q8 can't
# both fit on the 6GB card, so only one chat model plus the embedder stay
# loaded at a time -- switching chat models evicts the other one, which is
# the point, not a bug.

[gemma-q4]
model = /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
jinja = 1
ctx-size = 16384
n-gpu-layers = 99
temp = 1.0
top-p = 0.95
top-k = 64
cache-type-k = q8_0
cache-type-v = q8_0

[gemma-q8]
model = /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf
jinja = 1
ctx-size = 16384
temp = 1.0
top-p = 0.95
top-k = 64
cache-type-k = q8_0
cache-type-v = q8_0
# Q8's weights alone leave very little VRAM headroom on a 6GB card -- the
# default 4 parallel slots' combined KV cache + compute buffers doesn't
# reliably fit (seen failing outright with a CUDA OOM, not just running
# slow). One slot shrinks both proportionally; SillyTavern only opens one
# generation at a time anyway, so there's no real loss here.
parallel = 1
# NOT set here on purpose (unlike gemma-q4): llama-server's --fit (on by
# default, 1024 MiB target margin) only adjusts arguments left unset. With
# n-gpu-layers pinned to 99, --fit can't back off and just gives up
# entirely -- confirmed in testing ("failed to fit params... n_gpu_layers
# already set by user to 99, abort"), which is what let Q8 load right up to
# the VRAM edge and crash (or silently degrade to ~1-2 tok/s) whenever the
# embedder also needed room. Leaving it unset lets --fit offload a few
# layers to CPU instead: verified stable across 5 repeated loads (vs.
# crashing on some fraction of attempts before), at ~18.6 tok/s instead of
# ~50 tok/s. Real tradeoff, not a free fix -- see docs/LLAMA_CPP_BENCHMARK.md.
# n-gpu-layers = 99

# Section name matches the hardcoded "model" value in mem0-service/main.py's
# openai-provider embedder config -- keep them in sync if either changes.
[nomic-embed-text-v1.5]
model = /models/nomic-embed-text-v1.5.f16.gguf
embeddings = 1
ctx-size = 4096
n-gpu-layers = 99
# Physical batch size (--ubatch-size) defaults to 512, and a single
# embedding request that exceeds it fails outright rather than being split
# automatically -- llama.cpp's own error is explicit about this ("input
# (N tokens) is too large to process. increase the physical batch size").
# Hit in practice: mem0's extraction pipeline embeds the whole batch of
# buffered messages before building the extraction prompt, and a real flush
# reached 1315 tokens despite the extension's own ~800-token *estimate*
# (chars/4, not real tokenization) that decides when to flush -- narrative
# roleplay text with heavy punctuation/formatting tokenizes less
# efficiently than the estimate assumes. ctx-size raised alongside it so
# context isn't the next bottleneck. nomic-embed-text-v1.5 is small (137M
# params), so this costs little VRAM even on a tight card.
batch-size = 4096
ubatch-size = 4096