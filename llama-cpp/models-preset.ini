# Router-mode model presets for the llama-cpp service (docker-compose.yml).
# See docs/LLAMA_CPP_BENCHMARK.md ("Production shape: one router service,
# not two") for how this was arrived at and verified.
#
# One [section] per model; section name is what clients request via the
# "model" field (SillyTavern's llama.cpp connection dropdown, mem0's
# MEM0_LLM_MODEL / MEM0_EMBEDDER_PROVIDER config). Keys match llama-server
# CLI flags with the leading dashes dropped.
#
# --models-max 2 (set on the container command, not here): Q4 and Q8 can't
# both fit on the 6GB card, so only one chat model plus the embedder stay
# loaded at a time -- switching chat models evicts the other one, which is
# the point, not a bug.

[gemma-q4]
model = /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
jinja = 1
ctx-size = 16384
n-gpu-layers = 99
temp = 1.0
top-p = 0.95
top-k = 64
cache-type-k = q8_0
cache-type-v = q8_0

[gemma-q8]
model = /models/Gemma-4-E4B-Uncensored-HauhauCS-Aggressive-Q8_K_P.gguf
jinja = 1
ctx-size = 16384
n-gpu-layers = 99
temp = 1.0
top-p = 0.95
top-k = 64
cache-type-k = q8_0
cache-type-v = q8_0

# Section name matches the hardcoded "model" value in mem0-service/main.py's
# openai-provider embedder config -- keep them in sync if either changes.
[nomic-embed-text-v1.5]
model = /models/nomic-embed-text-v1.5.f16.gguf
embeddings = 1
ctx-size = 2048
n-gpu-layers = 99